name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      # Same image as docker-compose.yml. The database tests rebuild
      # bookie_test from the migrations on every run.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bookie
          POSTGRES_PASSWORD: bookie
          POSTGRES_DB: bookie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookie -d bookie"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # Rate limiting (D-001) uses Redis; the auth tests run against it.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://bookie:bookie@localhost:5432/bookie
      TEST_DATABASE_URL: postgresql://bookie:bookie@localhost:5432/bookie_test
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Also generates the Prisma client (apps/api postinstall).
      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations apply to an empty database
        run: pnpm --filter @bookie/api db:deploy

      - name: Tests (unit, end-to-end and database)
        run: pnpm test

      - name: Generated files are up to date (contract/openapi.json, .env.example)
        run: pnpm generate:check

      - name: Build
        run: pnpm build

  # Offline evaluation harness (BE-14): metrics, splits, no leakage, reproducibility (EVAL-1),
  # on synthetic data. The dataset itself is never in CI (D-004).
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - run: pip install -r eval/requirements.txt

      - name: Harness tests
        working-directory: eval
        run: python -m pytest -q

      # EVAL-4 (BE-15, D-028): the LLM evaluation scored from the committed outputs in
      # eval/llm/; fails when a headline metric dropped below the accepted baseline.
      - name: LLM regression check
        working-directory: eval
        run: python -m bookie_eval llm --check
